# go2rtc configuration — Windows webcam streaming via RTSP push
#
# Flow:
#   Webcam (Windows) → ffmpeg (Windows) → RTSP push → go2rtc (Docker)
#
# stream_camera.py on Windows runs:
#   ffmpeg -f dshow -i video="c922 Pro Stream Webcam" ... rtsp://localhost:8554/camera1
#
# go2rtc listens on :8554 and accepts the incoming RTSP publish automatically.
# No pull source is needed — the stream slot is pre-declared so the API and
# WebRTC/HLS endpoints are ready before ffmpeg connects.

api:
  listen: ":1984"

rtsp:
  listen: ":8554"
  default_query: "video"
  timeout: 5

webrtc:
  listen: ":8555"

log:
  level: info

streams:
  # Pre-declare slots so the Web UI and API show the stream names.
  # ffmpeg pushes RTSP here; go2rtc re-serves via RTSP / WebRTC / HLS.
  camera1: 
  camera2: 
